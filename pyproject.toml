[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bsbot"
version = "0.1.0"
description = "Brawl Stars automation bot — Mac brain + Android USB phone (v2, inspired by PylaAI)"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["bsbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run skips bench markers (run `pytest -m bench` to include).
addopts = "-q --color=yes -m 'not bench'"
markers = [
    "slow: tests that load ONNX models or run worker threads (~5s each)",
    "bench: performance benchmark (off by default, run with `-m bench`)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.bsbot]
# Marker for project tooling; runtime config lives in config.toml.
