name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: macos-14   # arm64 runner — matches dev machine (Apple Silicon)
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Use install.sh logic but headless (no venv).
          pip install -r requirements.txt
          pip install --no-deps "git+https://github.com/leng-yue/py-scrcpy-client.git@v0.5.0"
          pip install -e .

      - name: Run unit tests
        run: pytest -v

      - name: Run perf benchmarks
        run: pytest -v -m bench
        continue-on-error: true
