# BrawlStar-Bot v2 — user configuration
# All paths relative to repo root unless absolute.

[adb]
# Empty = first device detected by adb. Otherwise set serial (see `adb devices`).
# Use "emulator-5554" for BlueStacks, or your phone's serial.
device_serial = "emulator-5554"

[game]
mode = "solo_showdown"
brawler = "colt"

[session]
max_duration_minutes = 6     # ~1 match + entry/end transitions
max_matches = 1              # stop after N completed matches (0 = unlimited)

[performance]
target_ips = 30
scrcpy_max_size = 0          # 0 = native (must match template resolution)
scrcpy_bitrate = 8000000
inference_device = "auto"    # "auto" = CoreML if available, else CPU. "cpu" forces CPU.

[debug]
log_level = "INFO"
save_screenshots_on_error = true
record_session = false
